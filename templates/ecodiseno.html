<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>de ÜTSÜIN MMA | Ecodiseño</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .eco-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .eco-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }
        .selection-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .suggestion-card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--terracota);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        .idea-item {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .idea-item h3 {
            color: #2e7d32;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tag-process {
            font-size: 0.7rem;
            background: #e8f5e9;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <div class="logo-symbol">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo ÜTSÜIN MMA">
            </div>
            <div>
                <span class="logo-name">de ÜTSÜIN MMA</span>
                <small>Clasificación inteligente</small>
            </div>
        </div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/materiales">Materiales</a>
            <a href="/deteccion">Detección IA</a>
            <a href="/ecodiseno" class="active">Ecodiseño</a>
            <a href="/logout" style="color: var(--terracota);">Salir</a>
        </nav>

        <div class="status">
            <span class="status-dot blink"></span>
            En línea
        </div>
    </header>

    <div class="pattern-top"></div>

    <main class="eco-container">
        <section class="dashboard-header">
            <span class="eyebrow">LABORATORIO CREATIVO</span>
            <h1>Ecodiseño Circular</h1>
            <p>Selecciona un material y un proceso para descubrir nuevas vidas para los residuos.</p
        </section>

        <div class="eco-grid">
            <aside class="selection-panel">
                <div class="form-group">
                    <label>MATERIAL</label>
                    <select id="select-material">
                        <option value="PET">PET (Botellas)</option>
                        <option value="HDPE">HDPE (Tapas/Envases)</option>
                        <option value="LDPE">LDPE (Bolsas)</option>
                        <option value="PVC">PVC (Tuberías)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>PROCESO</label>
                    <select id="select-proceso">
                        <option value="triturado">Hojuelas / Triturado</option>
                        <option value="prensado">Bloques / Prensado</option>
                    </select>
                </div>

                <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="generarIdeas()">Generar Ideas</button>
            </aside>

            <article class="suggestion-card">
                <div id="ideas-container">
                    <div style="text-align: center; color: #999; margin-top: 100px;">
                        <span style="font-size: 3rem;">💡</span>
                        <p>Selecciona las opciones y presiona el botón para ver sugerencias.</p>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <script>
        const baseDeIdeas = {
            "PET": {
                "triturado": [
                    { t: "Fibra Textil", d: "Crea hilo para fabricar bolsos, camisetas o mochilas ecológicas." },
                    { t: "Relleno Térmico", d: "Utiliza las hojuelas para rellenar cojines o chaquetas de invierno." }
                ],
                "prensado": [
                    { t: "Láminas Rígidas", d: "Crea paneles divisorios o portadas de cuadernos resistentes." },
                    { t: "Mobiliario Urbano", d: "Bancos de parque creados a partir de bloques de PET prensado." }
                ]
            },
            "HDPE": {
                "triturado": [
                    { t: "Inyección de Moldes", d: "Crea macetas, llaveros o cubiertos reutilizables." },
                    { t: "Filamento 3D", d: "Procesa el triturado para crear filamento para impresoras 3D." }
                ],
                "prensado": [
                    { t: "Baldosas de Terrazo", d: "Crea pisos decorativos mezclando diferentes colores de tapas." },
                    { t: "Tablas de Corte", d: "Tablas para cocina altamente duraderas y fáciles de limpiar." }
                ]
            },
            "LDPE": {
                "triturado": [
                    { t: "Madera Plástica", d: "Mezcla con aserrín para crear vigas o postes de madera sintética." }
                ],
                "prensado": [
                    { t: "Aislante Acústico", d: "Paneles prensados para insonorizar estudios o habitaciones." },
                    { t: "Estuches Flexibles", d: "Prensado ligero para carpetas o estuches de herramientas." }
                ]
            },
            "PVC": {
                "triturado": [
                    { t: "Suela de Calzado", d: "El PVC triturado es ideal para fabricar suelas de botas industriales." }
                ],
                "prensado": [
                    { t: "Macetas de Pared", d: "Estructuras verticales para huertos urbanos." },
                    { t: "Protectores de Esquina", d: "Bloques resistentes para protección de columnas en parqueaderos." }
                ]
            }
        };

        function generarIdeas() {
            const mat = document.getElementById('select-material').value;
            const proc = document.getElementById('select-proceso').value;
            const container = document.getElementById('ideas-container');
            
            const ideas = baseDeIdeas[mat][proc] || [];
            
            if (ideas.length === 0) {
                container.innerHTML = `<p>No hay ideas registradas para esta combinación aún.</p>`;
                return;
            }

            let html = `<h2>Ideas para ${mat} (${proc})</h2><br>`;
            ideas.forEach(idea => {
                html += `
                    <div class="idea-item">
                        <h3><span>♻️</span> ${idea.t} <span class="tag-process">${proc}</span></h3>
                        <p>${idea.d}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
